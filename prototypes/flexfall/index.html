<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Voelt het fysiek vervormen van een speelvloer, waardoor tientallen knikkers tegelijk reageren, zo bevredigend dat je meteen nog een level wilt? -->
<!-- Date: 2026-11-21 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dcd0bd">
<title>FLEXFALL</title>
<style>
  :root { --ink: #14343b; --soft: #47636a; --paper: #fbf6ec; --coral: #e2573f; --teal: #1c7c82; --sand: #dcd0bd; }
  html, body { margin: 0; height: 100%; background: var(--sand); overflow: hidden; overscroll-behavior: none; }
  body { font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, sans-serif; color: var(--ink);
    font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 55%, rgba(60,40,20,.16) 100%); }
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 14px 0; display: grid;
    grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "lvl btns" "mid mid"; align-items: start; gap: 6px 8px; pointer-events: none; max-width: 620px; margin: 0 auto; }
  .lvl { grid-area: lvl; overflow: hidden; text-overflow: ellipsis; } .btns { grid-area: btns; } .mid { grid-area: mid; }
  #hud.off, #hint.off { opacity: 0; }
  #hud, #hint { transition: opacity .25s; }
  .lvl { white-space: nowrap; font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); padding-top: 6px; }
  .lvl b { display: block; font-size: 19px; letter-spacing: 0; text-transform: none; color: var(--ink); margin-top: 1px; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .count { white-space: nowrap; display: flex; align-items: center; gap: 8px; background: var(--paper); border-radius: 999px; padding: 6px 16px 6px 8px;
    box-shadow: 0 2px 0 rgba(20,52,59,.12), 0 8px 20px rgba(60,40,20,.12); font-size: 20px; font-weight: 600; color: var(--soft); }
  .count b { font-size: 30px; font-weight: 800; color: var(--ink); display: inline-block; min-width: 1.2em; text-align: right; }
  .count.bump b { animation: bump .22s; }
  .count.done { outline: 3px solid var(--teal); }
  @keyframes bump { 40% { transform: scale(1.35); color: var(--coral); } }
  .moves { white-space: nowrap; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: var(--soft); background: rgba(251,246,236,.85);
    border-radius: 999px; padding: 5px 12px; }
  .pip { width: 13px; height: 13px; border-radius: 50%; background: var(--coral); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); transition: transform .2s, background .2s; }
  .pip.used { background: #cdbfa8; transform: scale(.7); box-shadow: none; }
  .btns { display: flex; gap: 8px; justify-content: flex-end; pointer-events: auto; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .ib { width: 44px; height: 44px; border-radius: 50%; background: var(--paper); display: grid; place-items: center;
    box-shadow: 0 2px 0 rgba(20,52,59,.12), 0 6px 14px rgba(60,40,20,.1); }
  .ib:active, .big:active, .chip:active { transform: translateY(2px); }
  .ib svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); text-align: center; font-size: 17px; font-weight: 700;
    color: var(--ink); pointer-events: none; text-shadow: 0 1px 0 rgba(255,255,255,.7); }
  #hint span { background: rgba(251,246,236,.82); border-radius: 999px; padding: 6px 14px; }
  #card { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(220,208,189,.38); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .22s, visibility 0s .22s; }
  #card.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .22s; }
  .panel { background: var(--paper); border-radius: 28px; padding: 26px 26px 22px; width: min(84vw, 340px); text-align: center;
    box-shadow: 0 3px 0 rgba(20,52,59,.12), 0 24px 60px rgba(60,40,20,.28); transform: translateY(10px) scale(.97); transition: transform .25s cubic-bezier(.2,1.4,.4,1); }
  #card.on .panel { transform: none; }
  .panel h1 { margin: 0 0 6px; font-size: 34px; font-weight: 800; letter-spacing: .04em; }
  .panel h1.logo { letter-spacing: .14em; }
  .panel p { margin: 4px 0; font-size: 17px; line-height: 1.35; color: var(--soft); font-weight: 600; }
  .panel p.keys { font-size: 15px; }
  .stars { display: flex; justify-content: center; gap: 6px; margin: 2px 0 8px; }
  .stars svg { width: 46px; height: 46px; fill: #dccfb8; }
  .stars svg.on { fill: #f0a93a; animation: star .4s backwards cubic-bezier(.2,1.6,.4,1); }
  .stars svg.on:nth-child(2) { animation-delay: .12s; } .stars svg.on:nth-child(3) { animation-delay: .24s; }
  @keyframes star { from { transform: scale(0) rotate(-40deg); } }
  .big { display: block; width: 100%; margin-top: 14px; padding: 14px; border-radius: 18px; background: var(--coral); color: #fff; font-size: 20px; font-weight: 800;
    box-shadow: 0 4px 0 #a93a27; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .big.alt { background: #e8dcc6; color: var(--ink); box-shadow: 0 4px 0 #cbbc9f; text-shadow: none; margin-top: 12px; font-size: 17px; padding: 11px; }
  .chips { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
  .chip { width: 42px; height: 46px; border-radius: 14px; background: #e8dcc6; font-size: 18px; font-weight: 800; display: grid; place-items: center; line-height: 1; padding: 0; }

  .chip.cur { background: var(--teal); color: #fff; }

  #labels div { position: fixed; transform: translate(-50%, 0); font-size: 16px; font-weight: 700; background: var(--paper); border-radius: 999px; padding: 4px 12px; }
</style>
  <script defer src="./game.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="hud" class="off">
  <div class="lvl"><span id="lvl-n">Level 1</span><b id="lvl-name"></b></div>
  <div class="mid">
    <div class="count" id="count">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <defs><radialGradient id="mg" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#ffb9a6"/><stop offset=".55" stop-color="#f06a55"/><stop offset="1" stop-color="#a93a27"/></radialGradient></defs>
        <circle cx="17" cy="17" r="15" fill="url(#mg)"/><path d="M7 20c5-7 14-9 21-5" stroke="#ffe9d6" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".75"/>
        <ellipse cx="12" cy="10.5" rx="4.2" ry="2.6" fill="#fff" opacity=".85" transform="rotate(-28 12 10.5)"/>
      </svg>
      <span><b id="got">0</b> / <span id="need">0</span></span>
    </div>
    <div class="moves"><span id="pips" style="display:flex;gap:5px"></span><span id="moves-t">taps</span></div>
  </div>
  <div class="btns">
    <button class="ib" id="b-restart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg></button>
    <button class="ib" id="b-pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
    <button class="ib" id="b-mute" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path id="mute-x" d="M17 9a4 4 0 0 1 0 6"/></svg></button>
  </div>
</div>
<div id="hint" class="off"><span id="hint-t"></span></div>
<div id="card"><div class="panel" id="panel"></div></div>
<div id="labels"></div>
<script src="config.js"></script>
</body>
</html>
