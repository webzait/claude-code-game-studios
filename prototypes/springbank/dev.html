<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Is het opvangen en krachtig teruglanceren van dezelfde grote groep balletjes zo leuk dat spelers het steeds opnieuw willen doen? -->
<!-- Date: 2026-11-21 -->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SPRINGBANK</title>
<style>
  :root { --ink: #f6f0e0; --dim: #aab6e6; --gold: #f0b445; --teal: #2fd6c3; --card: rgba(13, 20, 46, 0.92); }
  html, body { margin: 0; height: 100%; background: #0a1022; overflow: hidden; overscroll-behavior: none; }
  body { font: 600 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
    font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px; pointer-events: none;
    background: linear-gradient(#0a1022 55%, rgba(10, 16, 34, 0)); }
  #hud[hidden], #hint[hidden], #overlay[hidden] { display: none; }
  #level { flex: 1; min-width: 0; font-size: 15px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #score { font-size: 30px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
  #score i { width: 20px; height: 20px; border-radius: 50%; display: block;
    background: radial-gradient(circle at 34% 30%, #fff 0 14%, #f6f0e0 30%, #b9ae92 78%, #7d745e); box-shadow: 0 0 10px rgba(47, 214, 195, 0.7); }
  #score small { font-size: 18px; color: var(--dim); font-weight: 700; }
  #right { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  #pips { display: flex; gap: 5px; align-items: flex-end; margin-right: 4px; }
  #pips b { width: 9px; height: 22px; border-radius: 3px; background: var(--gold); box-shadow: 0 0 8px rgba(240, 180, 69, 0.6);
    clip-path: polygon(50% 0, 100% 38%, 100% 100%, 0 100%, 0 38%); }
  #pips b.used { background: #2a376a; box-shadow: none; }
  button { font: inherit; color: var(--ink); border: 0; cursor: pointer; pointer-events: auto; touch-action: manipulation; }
  .icon { width: 40px; height: 40px; border-radius: 12px; background: rgba(36, 53, 110, 0.85); display: grid; place-items: center; padding: 0; }
  .icon svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .icon.off svg .wave { display: none; } .icon:not(.off) svg .cross { display: none; }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top)); width: max-content; max-width: calc(100% - 32px);
    box-sizing: border-box; text-align: center; pointer-events: none; font-size: 16px; color: var(--ink); background: rgba(13, 20, 46, 0.88);
    border: 1px solid #2f4186; border-radius: 14px; padding: 8px 14px; transition: opacity 0.4s; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6, 10, 24, 0.55); padding: 20px; }
  #card { width: min(360px, 100%); background: var(--card); border: 1px solid #2f4186; border-radius: 22px; padding: 26px 22px 22px;
    text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  #card h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: 3px; font-weight: 900; color: var(--gold); }
  #card h1.plain { letter-spacing: 0.5px; font-size: 28px; color: var(--ink); }
  #card p { margin: 6px 0; color: var(--dim); font-size: 16px; font-weight: 500; }
  #card ol { list-style: none; margin: 16px 0 6px; padding: 0; text-align: left; display: grid; gap: 10px; }
  #card li { display: flex; align-items: center; gap: 12px; font-size: 16px; color: var(--ink); }
  #card li svg { flex: none; width: 34px; height: 34px; fill: none; stroke: var(--teal); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #go { margin-top: 18px; width: 100%; padding: 15px; border-radius: 14px; font-size: 19px; font-weight: 800; color: #1a1202;
    background: linear-gradient(#ffd27a, #f0b445); box-shadow: 0 6px 0 #a96f14; }
  #go:active { transform: translateY(3px); box-shadow: 0 3px 0 #a96f14; }
  #levels { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
  #levels[hidden] { display: none; }
  #levels button { width: 44px; height: 44px; border-radius: 12px; background: #24356e; font-size: 17px; font-weight: 800; }
  #keys { margin-top: 14px; font-size: 14px; color: var(--dim); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" hidden>
  <div id="level"></div>
  <div id="score"><i></i><span id="scored">0</span><small id="target">/ 0</small></div>
  <div id="right">
    <div id="pips" aria-label="lanceringen"></div>
    <button class="icon" id="btn-reset" aria-label="Level opnieuw"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg></button>
    <button class="icon" id="btn-pause" aria-label="Pauze"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
    <button class="icon" id="btn-mute" aria-label="Geluid"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="cross" d="M16 9l5 6M21 9l-5 6"/></svg></button>
  </div>
</div>
<div id="hint" hidden></div>
<div id="overlay" hidden>
  <div id="card">
    <h1 id="card-title"></h1>
    <p id="card-text"></p>
    <ol id="howto">
      <li><svg viewBox="0 0 34 34"><path d="M6 12v12h22V12"/><path d="M13 4v9M21 2v9M17 7v9"/></svg><span>Houd vast: de bak vangt de balletjes</span></li>
      <li><svg viewBox="0 0 34 34"><path d="M9 14v10h16V14"/><path d="M3 19h3M28 19h3M5 16l-3 3 3 3M29 16l3 3-3 3"/></svg><span>Sleep: zet de bak onder een doel</span></li>
      <li><svg viewBox="0 0 34 34"><path d="M8 22v8h18v-8"/><path d="M17 20V4M11 10l6-6 6 6"/></svg><span>Laat los: de veer schiet alles omhoog</span></li>
    </ol>
    <button id="go"></button>
    <div id="levels"></div>
    <div id="keys">Toetsenbord: pijltjes, spatie, R, P, M</div>
  </div>
</div>
<script src="config.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
