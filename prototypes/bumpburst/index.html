<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEEBE5">
<title>BumpBurst</title>

</head>
<body>
<div id="app">
  <header id="top">
    <div class="lvl">
      <span id="lvl-num">LEVEL 1</span>
      <span id="lvl-name">First Burst</span>
    </div>
    <div class="goal" id="goal" aria-label="Marbles collected">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#fff" stroke="#b9bfcb" stroke-width="1.5"/><circle cx="8.5" cy="8.5" r="2.6" fill="#eef1f7"/></svg>
      <span><b id="got">0</b><i>/</i><span id="need">3</span></span>
    </div>
    <div class="tools">
      <button id="btn-mute" class="tool" aria-label="Sound on or off">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="waves" d="M15 9c1.3 1.6 1.3 4.4 0 6M17.6 6.5c2.6 3 2.6 8 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="cross" d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-reset" class="tool" aria-label="Reset level">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M18.4 8.2A7.4 7.4 0 1 0 19.4 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M19.6 3.6v5.2h-5.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <p id="hint"></p>
  <main id="stage"><canvas id="view"></canvas></main>
  <footer id="bottom">
    <div id="pips" aria-label="Pulses left"></div>
    <div id="buttons"></div>
  </footer>

  <section id="result" class="sheet" hidden>
    <div class="card">
      <h2 id="res-title">Level clear</h2>
      <p id="res-sub"></p>
      <button id="res-main" class="cta">Next level</button>
      <button id="res-alt" class="ghost">Play again</button>
    </div>
  </section>

  <section id="title" class="sheet">
    <div class="card">
      <div class="logo" aria-hidden="true"><i class="r"></i><i class="b"></i><i class="y"></i></div>
      <h1>BUMPBURST</h1>
      <p class="tag">One color. One burst.<br>Big chain reactions.</p>
      <button id="btn-play" class="cta">Play</button>
      <div id="dots" aria-label="Levels"></div>
      <p class="how">Tap a color: every bumper of that color bursts at once.</p>
    </div>
  </section>
  <div id="fps" hidden></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
