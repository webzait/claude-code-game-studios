<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flockbot 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f3f8; color: #24314f; font: 15px/1.3 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  .bar { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 0 12px; }
  button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 14px; border: 2px solid #24314f22; background: #fff; color: #24314f; cursor: pointer; }
  button[aria-pressed=true] { border-color: #24314f; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; }
  .hint { position: fixed; top: 12px; left: 0; right: 0; text-align: center; color: #55607c; font-size: 13px; }
</style>
<div class="hint">Sleep om te draaien · knijp of scroll om te zoomen</div>
<canvas id="view"></canvas>
<div class="bar">
  <button data-color="red" aria-pressed="true"><span class="dot" style="background:#F14A4F"></span>Rood</button>
  <button data-color="blue" aria-pressed="false"><span class="dot" style="background:#2E84F1"></span>Blauw</button>
  <button data-color="yellow" aria-pressed="false"><span class="dot" style="background:#F4C62F"></span>Geel</button>
  <button id="spin" aria-pressed="true">Draaien</button>
  <button id="glb">Download .glb</button>
</div>
<script type="module" src="./viewer.ts"></script>
</html>
