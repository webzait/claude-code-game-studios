<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F1EC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Turnflock</title>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="title">
          <div class="level-no" id="levelNo">LEVEL 1</div>
          <div class="level-name" id="levelName"></div>
        </div>
        <div class="stats">
          <div class="pill" id="collectedPill" aria-label="Robots collected">
            <svg viewBox="0 0 24 24" class="ico"><rect x="4" y="7" width="16" height="13" rx="4.5" fill="currentColor" /><circle cx="9.3" cy="13" r="1.9" fill="#fff" /><circle cx="14.7" cy="13" r="1.9" fill="#fff" /><rect x="11.2" y="2.5" width="1.6" height="5" rx=".8" fill="currentColor" /><circle cx="12" cy="2.8" r="1.7" fill="currentColor" /></svg>
            <span id="collected">0/0</span>
          </div>
          <div class="pill moves" id="movesPill" aria-label="Moves left">
            <span class="moves-num" id="moves">0</span>
            <span class="moves-label">MOVES</span>
          </div>
        </div>
      </header>
      <nav class="dots" id="dots" aria-label="Levels"></nav>
      <main class="stage"><canvas id="board"></canvas></main>
      <footer class="controls">
        <div class="tools">
          <button class="tool" id="undo" aria-label="Undo">
            <svg viewBox="0 0 24 24" class="ico"><path d="M9 7 4.5 11.5 9 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M5 11.5h9a5 5 0 0 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></svg>
            <span>Undo</span>
          </button>
          <button class="tool" id="restart" aria-label="Restart">
            <svg viewBox="0 0 24 24" class="ico"><path d="M19 12a7 7 0 1 1-2.3-5.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /><path d="M19.5 3.5v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <span>Restart</span>
          </button>
          <button class="tool" id="replay" aria-label="Replay">
            <svg viewBox="0 0 24 24" class="ico"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" /></svg>
            <span>Replay</span>
          </button>
        </div>
        <div class="commands" id="commands">
          <button class="cmd red" data-cmd="red" aria-label="Turn red, then all move"></button>
          <button class="cmd blue" data-cmd="blue" aria-label="Turn blue, then all move"></button>
          <button class="cmd yellow" data-cmd="yellow" aria-label="Turn yellow, then all move"></button>
          <button class="cmd forward" data-cmd="forward" aria-label="All move forward"></button>
        </div>
      </footer>
      <section class="card" id="card" hidden>
        <div class="card-inner">
          <div class="stars" id="stars"></div>
          <h2 id="cardTitle"></h2>
          <p id="cardText"></p>
          <div class="card-actions">
            <button class="ghost" id="cardSecondary"></button>
            <button class="primary" id="cardPrimary"></button>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
