<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4EAFF8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/turnflock/brand/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/turnflock/brand/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Turnflock" />
    <meta name="application-name" content="Turnflock" />
    <title>Turnflock</title>
  </head>
  <body>
    <div id="backdrop" class="tf-decor-screen" aria-hidden="true">
      <div class="tf-bg"><div class="tf-bg-scene"><i class="tf-bg-glint tf-bg-far"></i><i class="tf-bg-glint tf-bg-mid"></i><i class="tf-bg-glint tf-bg-near"></i><i class="tf-bg-quay tf-bg-left"></i><i class="tf-bg-quay tf-bg-right"></i></div></div>
      <div class="tf-decor-layer"><img class="tf-decor-piece tf-decor-sprig-tl" data-art="decor-sprig" alt="" /><img class="tf-decor-piece tf-decor-tuft-tr" data-art="decor-clover" alt="" /><img class="tf-decor-piece tf-decor-back-l" data-art="decor-large" alt="" /><img class="tf-decor-piece tf-decor-back-r" data-art="decor-clover" alt="" /><img class="tf-decor-piece tf-decor-front-l" data-art="decor-small" alt="" /><img class="tf-decor-piece tf-decor-front-r" data-art="decor-large" alt="" /></div>
    </div>
    <div id="app">
      <section class="screen tf-levels-phone tf-levels-a tf-logo-band" id="map">
        <header class="tf-levels-head">
          <h1 class="tf-levels-brand"><img class="tf-levels-logo" src="./assets/turnflock/brand/logo.webp" alt="Turnflock" width="768" height="360" decoding="async" draggable="false" /></h1>
          <span id="mapCoins"></span>
          <span class="tf-levels-pill tf-levels-progress" id="mapProgress"><span><span id="mapCount">0</span><small id="mapTotal"></small></span><span><i class="tf-levels-star"></i><span id="mapStars">0</span></span></span>
          <button type="button" class="tf-btn tf-utility" id="toSettings" aria-label="Settings"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path><circle cx="16" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="2.6"></circle><circle cx="8" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="2.6"></circle></svg></span></span></button>
        </header>
        <div class="tf-levels-body"><div class="tf-levels-tray"><div class="tf-levels-grid" id="nodes"></div></div></div>
        <footer class="tf-levels-dock">
          <div class="tf-levels-pager" id="pager">
            <button type="button" class="tf-btn tf-utility" id="pagePrev" aria-label="Previous levels"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></span></button>
            <div class="tf-levels-pageinfo" id="pageInfo"><span id="pageLabel"></span><span class="tf-levels-dots" id="pageDots"></span></div>
            <button type="button" class="tf-btn tf-utility" id="pageNext" aria-label="Next levels"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></span></button>
          </div>
          <button type="button" class="tf-btn tf-action tf-levels-play" id="continue" aria-label="Play"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 5v14l11.4-7z" fill="currentColor" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"></path></svg><span class="tf-label" id="continueLabel">Play</span></span></span></button>
        </footer>
      </section>

      <section class="screen" id="level" hidden>
        <header class="top">
          <button class="back" id="levelBack" aria-label="Back to levels"><svg viewBox="0 0 24 24" class="ico"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
          <div class="tf-status" role="group" aria-label="Level, moves left and robots home">
            <div class="tf-status-plate">
              <div class="tf-status-cell"><span class="tf-status-label" id="levelWord">LEVEL</span><span class="tf-status-num" id="levelNo">1</span></div>
              <div class="tf-status-cell moves" id="movesPill"><span class="tf-status-label">MOVES</span><span class="tf-status-num" id="moves">0</span></div>
            </div>
            <div class="tf-status-tab" id="collectedPill" aria-label="Robots home"><svg viewBox="0 0 24 24" class="ico"><rect x="4" y="7" width="16" height="13" rx="4.5" fill="currentColor" /><circle cx="9.3" cy="13" r="1.9" fill="#fff" /><circle cx="14.7" cy="13" r="1.9" fill="#fff" /><rect x="11.2" y="2.5" width="1.6" height="5" rx=".8" fill="currentColor" /><circle cx="12" cy="2.8" r="1.7" fill="currentColor" /></svg><span id="collected">0/0</span></div>
            <span class="tf-sr" id="levelName"></span>
          </div>
          <span id="levelCoins"></span>
        </header>
        <main class="stage"><canvas id="board"></canvas></main>
        <div class="hint-line" id="hint" role="status" aria-live="polite"></div>
        <footer class="controls">
          <div class="tools">
            <button type="button" class="tf-btn tf-utility" id="undo"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="tf-ink-shadow" transform="translate(0 1.3)"><path d="M9.4 4.2 3.6 9.3l5.8 5.1z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"></path><path d="M9 9.3h5.4a5.3 5.3 0 0 1 0 10.6H9.6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M9.4 4.2 3.6 9.3l5.8 5.1z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"></path><path d="M9 9.3h5.4a5.3 5.3 0 0 1 0 10.6H9.6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg><span class="tf-label">Undo</span></span></span></button>
            <button type="button" class="tf-btn tf-utility" id="restart"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="tf-ink-shadow" transform="translate(0 1.3)"><path d="M17.1 16.9A7 7 0 1 1 15.5 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18.4 3.2v6h-6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M17.1 16.9A7 7 0 1 1 15.5 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18.4 3.2v6h-6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg><span class="tf-label">Restart</span></span></span></button>
            <button type="button" class="tf-btn tf-utility" id="replay"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="tf-ink-shadow" transform="translate(0 1.3)"><path d="M7.4 5v14l11.4-7z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"></path></g><g><path d="M7.4 5v14l11.4-7z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"></path></g></svg><span class="tf-label tf-sr">Replay</span></span></span></button>
            <button type="button" id="scan" aria-label="Hint"></button>
          </div>
          <div class="commands" id="commands">
            <button type="button" class="tf-btn tf-action red cmd" data-cmd="red" aria-label="Turn red, then all move"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="tf-ink-shadow" transform="translate(0 1.3)"><path d="M17.1 16.9A7 7 0 1 1 15.5 8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18.4 3.2v6h-6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M17.1 16.9A7 7 0 1 1 15.5 8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18.4 3.2v6h-6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></g></svg></span></span></button>
            <button type="button" class="tf-btn tf-action blue cmd" data-cmd="blue" aria-label="Turn blue, then all move"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="tf-ink-shadow" transform="translate(0 1.3)"><path d="M17.1 16.9A7 7 0 1 1 15.5 8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18.4 3.2v6h-6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M17.1 16.9A7 7 0 1 1 15.5 8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18.4 3.2v6h-6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></g></svg></span></span></button>
            <button type="button" class="tf-btn tf-action yellow cmd" data-cmd="yellow" aria-label="Turn yellow, then all move"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="tf-ink-shadow" transform="translate(0 1.3)"><path d="M17.1 16.9A7 7 0 1 1 15.5 8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18.4 3.2v6h-6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M17.1 16.9A7 7 0 1 1 15.5 8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18.4 3.2v6h-6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></g></svg></span></span></button>
            <button type="button" class="tf-btn tf-action forward cmd" data-cmd="forward" aria-label="All move forward"><span class="tf-clip"><span class="tf-face"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="tf-ink-shadow" transform="translate(0 1.3)"><path d="M12 20.6V6M5.2 11.4 12 4.6l6.8 6.8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M12 20.6V6M5.2 11.4 12 4.6l6.8 6.8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></g></svg></span></span></button>
          </div>
        </footer>
      </section>

      <section class="screen tf-set-frame" id="settings" hidden></section>
      <section class="screen tf-set-frame" id="lab" hidden></section>

      <section class="overlay tf-end-host" id="card" hidden>
        <div class="tf-end-dim"></div>
        <div id="cardBody"></div>
      </section>
      <section class="overlay coin-info" id="coinInfo" hidden>
        <div class="tf-coin-info" role="dialog" aria-modal="true" aria-labelledby="coinInfoTitle">
          <div id="coinInfoBody"></div>
          <button type="button" class="tf-btn tf-utility" id="coinInfoClose"><span class="tf-clip"><span class="tf-face"><span class="tf-label">Close</span></span></span></button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
